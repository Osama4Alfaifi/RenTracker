<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>متابعة الإيجارات</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- شاشة تسجيل الدخول -->
  <section id="login-view" class="view">
    <form id="login-form" class="login-card">
      <h1>متابعة الإيجارات</h1>
      <p class="subtitle">تسجيل الدخول</p>
      <label>البريد الإلكتروني
        <input type="email" id="login-email" required autocomplete="username" />
      </label>
      <label>كلمة المرور
        <input type="password" id="login-password" required autocomplete="current-password" />
      </label>
      <button type="submit">دخول</button>
      <p id="login-error" class="error-text" hidden></p>
    </form>
  </section>

  <!-- التطبيق الرئيسي -->
  <div id="app-view" class="view" hidden>
    <header class="app-header">
      <h1>متابعة الإيجارات</h1>
      <div class="header-right">
        <span id="user-email" class="user-email"></span>
        <button id="logout-btn" class="btn-ghost">خروج</button>
      </div>
    </header>

    <nav class="tabs">
      <button class="tab-btn active" data-tab="dashboard">لوحة المتابعة</button>
      <button class="tab-btn" data-tab="history">السجل</button>
      <button class="tab-btn" data-tab="units">إدارة الوحدات</button>
    </nav>

    <!-- لوحة المتابعة -->
    <section id="dashboard-tab" class="tab-panel active">
      <div id="seed-banner" class="seed-banner" hidden>
        <p>لا توجد مبانٍ أو وحدات مسجلة بعد.</p>
        <button id="seed-btn">تهيئة مجمع ليمون ومجمع المشارف تلقائيًا</button>
      </div>

      <div id="dashboard-building-tabs" class="sub-tabs"></div>

      <div class="month-switcher">
        <button id="prev-month" class="btn-ghost">‹ الشهر السابق</button>
        <span id="month-label" class="month-label"></span>
        <button id="next-month" class="btn-ghost">الشهر التالي ›</button>
      </div>

      <div id="summary-bar" class="summary-bar"></div>

      <div id="buildings-container"></div>
    </section>

    <!-- السجل -->
    <section id="history-tab" class="tab-panel">
      <div class="history-filters">
        <label>المبنى
          <select id="history-building-select"></select>
        </label>
        <label>الوحدة
          <select id="history-unit-select"></select>
        </label>
      </div>
      <div id="history-results"></div>

      <h3>سجل المستأجرين</h3>
      <div id="history-tenancy-results"></div>
    </section>

    <!-- إدارة الوحدات -->
    <section id="units-tab" class="tab-panel">
      <div id="units-building-tabs" class="sub-tabs"></div>
      <div id="units-admin-container"></div>
    </section>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
